name: AME CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SQLite FTS5
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect(":memory:")
          c.execute("create virtual table x using fts5(body)")
          print("sqlite", sqlite3.sqlite_version, "fts5=ok")
          PY
      - name: Run tests
        run: python -m unittest -v
